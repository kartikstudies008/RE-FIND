{% extends 'base.html' %}

{% block title %}500 Server Error – ReFind AI{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="p-5 bg-white rounded-4 shadow-sm border max-w-600 mx-auto my-5">
        <div class="display-1 fw-bold text-warning mb-2">500</div>
        <h3 class="fw-bold mb-3">Internal Server Error</h3>
        <p class="text-muted mb-4">
            An unexpected error occurred while processing your request. The issue has been logged and our team has been notified.
        </p>
        <a href="{{ url_for('main.index') }}" class="btn btn-primary px-4 py-2">
            <i class="bi bi-house-door me-1"></i> Return Home
        </a>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block title %}404 Page Not Found – ReFind AI{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="p-5 bg-white rounded-4 shadow-sm border max-w-600 mx-auto my-5">
        <div class="display-1 fw-bold text-primary mb-2">404</div>
        <h3 class="fw-bold mb-3">Item or Page Not Found</h3>
        <p class="text-muted mb-4">
            The page or lost/found item you are looking for may have been resolved, removed, or the link is incorrect.
        </p>
        <div class="d-flex justify-content-center gap-2">
            <a href="{{ url_for('main.index') }}" class="btn btn-primary px-4 py-2">
                <i class="bi bi-house-door me-1"></i> Return Home
            </a>
            <a href="{{ url_for('main.browse') }}" class="btn btn-outline-secondary px-4 py-2">
                <i class="bi bi-search me-1"></i> Browse Listings
            </a>
        </div>
    </div>
</div>
{% endblock %}
